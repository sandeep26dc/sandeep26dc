<svg width="1000" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sharp Neon Glow for Thin Line -->
    <filter id="ecg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Scanning Mask -->
    <mask id="scan-mask">
      <rect x="-1000" y="0" width="1000" height="150" fill="white">
        <animateTransform attributeName="transform" type="translate" from="0,0" to="2000,0" dur="5s" repeatCount="indefinite" />
      </rect>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1000" height="150" fill="#05070A" />

  <!-- Ultra-Subtle Precision Grid -->
  <path d="M 0 0 L 1000 0 M 0 25 L 1000 25 M 0 50 L 1000 50 M 0 75 L 1000 75 M 0 100 L 1000 100 M 0 125 L 1000 125 M 0 150 L 1000 150 M 0 0 L 0 150 M 25 0 L 25 150 M 50 0 L 50 150 M 75 0 L 75 150 M 100 0 L 100 150 M 125 0 L 125 150 M 150 0 L 150 150 M 175 0 L 175 150 M 200 0 L 200 150 M 225 0 L 225 150 M 250 0 L 250 150 M 275 0 L 275 150 M 300 0 L 300 150 M 325 0 L 325 150 M 350 0 L 350 150 M 375 0 L 375 150 M 400 0 L 400 150 M 425 0 L 425 150 M 450 0 L 450 150 M 475 0 L 475 150 M 500 0 L 500 150 M 525 0 L 525 150 M 550 0 L 550 150 M 575 0 L 575 150 M 600 0 L 600 150 M 625 0 L 625 150 M 650 0 L 650 150 M 675 0 L 675 150 M 700 0 L 700 150 M 725 0 L 725 150 M 750 0 L 750 150 M 775 0 L 775 150 M 800 0 L 800 150 M 825 0 L 825 150 M 850 0 L 850 150 M 875 0 L 875 150 M 900 0 L 900 150 M 925 0 L 925 150 M 950 0 L 950 150 M 975 0 L 975 150 M 1000 0 L 1000 150" 
        fill="none" stroke="#FF0000" stroke-width="0.3" stroke-opacity="0.08" />

  <!-- The High-Frequency Minimal Heartbeat (1.2px Stroke) -->
  <g filter="url(#ecg-glow)" mask="url(#scan-mask)">
    <path d="M 0 75 L 50 75 L 55 68 L 60 75 L 70 75 L 75 30 L 80 110 L 85 75 L 100 75 L 110 60 L 120 75 L 200 75 L 205 68 L 210 75 L 220 75 L 225 30 L 230 110 L 235 75 L 250 75 L 260 60 L 270 75 L 350 75 L 355 68 L 360 75 L 370 75 L 375 30 L 380 110 L 385 75 L 400 75 L 410 60 L 420 75 L 500 75 L 505 68 L 510 75 L 520 75 L 525 30 L 530 110 L 535 75 L 550 75 L 560 60 L 570 75 L 650 75 L 655 68 L 660 75 L 670 75 L 675 30 L 680 110 L 685 75 L 700 75 L 710 60 L 720 75 L 800 75 L 805 68 L 810 75 L 820 75 L 825 30 L 830 110 L 835 75 L 850 75 L 860 60 L 870 75 L 950 75 L 955 68 L 960 75 L 970 75 L 975 30 L 980 110 L 985 75 L 1000 75" 
          fill="none" stroke="#FF0000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    </path>
  </g>

  <!-- Bright Leading Scanning Head -->
  <g filter="url(#ecg-glow)">
    <circle cx="0" cy="75" r="3" fill="#FFFFFF">
        <animateTransform attributeName="transform" type="translate" from="0,0" to="1000,0" dur="5s" repeatCount="indefinite" />
        <!-- Position Logic: Perfectly synchronized with the thinner path spikes -->
        <animate attributeName="cy" values="75;75;68;75;75;30;110;75;75;60;75;75;75;68;75;75;30;110;75;75;60;75;75;75;68;75;75;30;110;75;75;60;75;75;75;68;75;75;30;110;75;75;60;75;75;75;68;75;75;30;110;75;75;60;75;75;75;68;75;75;30;110;75;75;60;75;75;75;68;75;75;30;110;75;75;60;75;75" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
