<svg width="1000" height="40" viewBox="0 0 1000 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="slim-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <mask id="scan-mask">
      <rect x="-1000" y="0" width="1000" height="40" fill="white">
        <animateTransform attributeName="transform" type="translate" from="0,0" to="2000,0" dur="5s" repeatCount="indefinite" />
      </rect>
    </mask>
  </defs>

  <rect width="1000" height="40" fill="#05070A" />

  <!-- The Slim Pulse (Razor Thin) -->
  <g filter="url(#slim-glow)" mask="url(#scan-mask)">
    <path d="M 0 20 L 40 20 L 45 15 L 50 20 L 60 20 L 65 5 L 70 35 L 75 20 L 90 20 L 100 12 L 110 20 L 200 20 L 205 15 L 210 20 L 220 20 L 225 5 L 230 35 L 235 20 L 250 20 L 260 12 L 270 20 L 360 20 L 365 15 L 370 20 L 380 20 L 385 5 L 390 35 L 395 20 L 410 20 L 420 12 L 430 20 L 520 20 L 525 15 L 530 20 L 540 20 L 545 5 L 550 35 L 555 20 L 570 20 L 580 12 L 590 20 L 680 20 L 685 15 L 690 20 L 700 20 L 705 5 L 710 35 L 715 20 L 730 20 L 740 12 L 750 20 L 840 20 L 845 15 L 850 20 L 860 20 L 865 5 L 870 35 L 875 20 L 890 20 L 900 12 L 910 20 L 1000 20" 
          fill="none" stroke="#FF0000" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
    </path>
  </g>

  <circle cx="0" cy="20" r="1.2" fill="#FFFFFF">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="1000,0" dur="5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="20;20;15;20;20;5;35;20;20;12;20;20;20;15;20;20;5;35;20;20;12;20;20;20;15;20;20;5;35;20;20;12;20;20;20;15;20;20;5;35;20;20;12;20;20;20;15;20;20;5;35;20;20;12;20;20;20;15;20;20;5;35;20;20;12;20" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>
