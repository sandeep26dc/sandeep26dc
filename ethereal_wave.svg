<svg width="1000" height="350" viewBox="0 0 1000 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="350" fill="#05070A" />

  <!-- THE ETHEREAL WAVE (Inspired by your video) -->
  <g filter="url(#neon-glow)" opacity="0.6">
    <!-- Wave Layer 1 -->
    <path d="M0 200 Q 250 100 500 200 T 1000 200" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="2,10">
      <animate attributeName="d" values="M0 200 Q 250 100 500 200 T 1000 200; M0 200 Q 250 300 500 200 T 1000 200; M0 200 Q 250 100 500 200 T 1000 200" dur="10s" repeatCount="indefinite" />
    </path>
    <!-- Wave Layer 2 -->
    <path d="M0 210 Q 250 150 500 210 T 1000 210" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="1,15">
      <animate attributeName="d" values="M0 210 Q 250 150 500 210 T 1000 210; M0 210 Q 250 250 500 210 T 1000 210; M0 210 Q 250 150 500 210 T 1000 210" dur="7s" repeatCount="indefinite" />
    </path>
    <!-- Wave Layer 3 -->
    <path d="M0 190 Q 250 250 500 190 T 1000 190" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="5,20">
      <animate attributeName="d" values="M0 190 Q 250 250 500 190 T 1000 190; M0 190 Q 250 50 500 190 T 1000 190; M0 190 Q 250 250 500 190 T 1000 190" dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- THE NAME: SANDEEP SOM -->
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Verdana, sans-serif" font-size="75" font-weight="900" fill="#FFFFFF" style="letter-spacing: 15px; filter: drop-shadow(0 0 10px rgba(0,240,255,0.5));">
    SANDEEP SOM
  </text>
  
  <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle" font-family="monospace" font-size="16" fill="#00F0FF" style="letter-spacing: 8px; opacity: 0.8;">
    DIGITAL ALCHEMIST • EXPERIMENTER
  </text>
</svg>
