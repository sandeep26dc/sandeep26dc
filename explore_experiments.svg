<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- The Breathing Glow -->
  <rect x="50" y="20" width="300" height="60" rx="30" fill="url(#glow)">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" />
    <animate attributeName="width" values="290;310;290" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x" values="55;45;55" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- The Button Frame -->
  <rect x="50" y="20" width="300" height="60" rx="30" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.5" />
  
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="monospace" font-size="14" fill="#00F0FF" font-weight="bold" letter-spacing="4">
    EXPLORE EXPERIMENTS
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
  </text>
</svg>
