<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="#05070A" />

  <!-- Animated Landscape Glowing Rings (Pinterest Inspired) -->
  <g filter="url(#glow)">
    <ellipse cx="500" cy="150" rx="450" ry="100" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.3">
      <animate attributeName="rx" values="450;480;450" dur="5s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="500" cy="150" rx="350" ry="70" fill="none" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.5">
      <animate attributeName="rx" values="350;380;350" dur="4s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="500" cy="150" rx="250" ry="40" fill="none" stroke="#00F0FF" stroke-width="3" stroke-opacity="0.8">
      <animate attributeName="rx" values="250;270;250" dur="3s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- The Name: SANDEEP SOM -->
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Verdana, sans-serif" font-size="65" font-weight="900" fill="#FFFFFF" style="letter-spacing: 12px;">
    SANDEEP SOM
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
  </text>
  
  <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="monospace" font-size="14" fill="#00F0FF" style="letter-spacing: 5px; opacity: 0.7;">
    DIGITAL ALCHEMIST • EXPERIMENTER
  </text>
</svg>
