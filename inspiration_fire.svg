<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="flame-blur">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="800" height="120" fill="#05070A" rx="15"/>

  <!-- Live Blue Fire Animation (Faint & Soft) -->
  <g filter="url(#flame-blur)" opacity="0.4">
    <path d="M0 120 Q 50 20 100 120 T 200 120 T 300 120 T 400 120 T 500 120 T 600 120 T 700 120 T 800 120" fill="#00F0FF">
      <animate attributeName="d" values="M0 120 Q 50 20 100 120 T 200 120 T 300 120 T 400 120 T 500 120 T 600 120 T 700 120 T 800 120; M0 120 Q 50 50 100 120 T 200 120 T 300 120 T 400 120 T 500 120 T 600 120 T 700 120 T 800 120; M0 120 Q 50 20 100 120 T 200 120 T 300 120 T 400 120 T 500 120 T 600 120 T 700 120 T 800 120" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M0 120 Q 80 40 150 120 T 300 120 T 450 120 T 600 120 T 750 120 T 900 120" fill="#0080FF" opacity="0.5">
      <animate attributeName="d" values="M0 120 Q 80 40 150 120 T 300 120 T 450 120 T 600 120 T 750 120 T 900 120; M0 120 Q 80 10 150 120 T 300 120 T 450 120 T 600 120 T 750 120 T 900 120; M0 120 Q 80 40 150 120 T 300 120 T 450 120 T 600 120 T 750 120 T 900 120" dur="7s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Title Text -->
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Verdana, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" style="letter-spacing: 6px;">
    THE INSPIRATION TERMINAL
  </text>
</svg>
