<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="200" fill="#05070A" rx="20"/>

  <!-- Soft Blue Bottom Smoke/Glow -->
  <ellipse cx="400" cy="200" rx="400" ry="80" fill="#00F0FF" opacity="0.15" filter="url(#glow)">
     <animate attributeName="ry" values="70;90;70" dur="4s" repeatCount="indefinite" />
  </ellipse>

  <!-- Animated Electric Sparks (Rising Lines & Dots) -->
  <g stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <!-- Spark 1 -->
    <line x1="150" y1="180" x2="150" y2="160">
      <animate attributeName="y1" values="220;-20" dur="3s" repeatCount="indefinite" />
      <animate attributeName="y2" values="200;-40" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
    </line>
    <!-- Spark 2 -->
    <circle cx="280" cy="190" r="1.5" fill="#00F0FF">
      <animate attributeName="cy" values="220;-20" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <!-- Spark 3 -->
    <line x1="450" y1="180" x2="450" y2="150">
      <animate attributeName="y1" values="220;-20" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="y2" values="190;-50" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" />
    </line>
    <!-- Spark 4 -->
    <circle cx="580" cy="190" r="1" fill="#00F0FF">
      <animate attributeName="cy" values="220;-20" dur="5.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="5.2s" repeatCount="indefinite" />
    </circle>
    <!-- Spark 5 -->
    <line x1="720" y1="180" x2="720" y2="165">
      <animate attributeName="y1" values="220;-20" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="y2" values="205;-35" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="3.8s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Main Title -->
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Verdana, sans-serif" font-size="32" font-weight="900
