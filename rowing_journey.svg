<svg width="1000" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="150" fill="#05070A" />

  <!-- Animated Wavy Water -->
  <path d="M0 130 Q 250 110 500 130 T 1000 130 V 150 H 0 Z" fill="#00F0FF" opacity="0.1">
    <animate attributeName="d" values="M0 130 Q 250 110 500 130 T 1000 130 V 150 H 0 Z; M0 130 Q 250 150 500 130 T 1000 130 V 150 H 0 Z; M0 130 Q 250 110 500 130 T 1000 130 V 150 H 0 Z" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- The Boat and Rower Group -->
  <g>
    <!-- Translation across the screen -->
    <animateTransform attributeName="transform" type="translate" from="-150,0" to="1150,0" dur="20s" repeatCount="indefinite" />
    
    <!-- Bobbing motion on waves -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,5; 0,0" dur="3s" repeatCount="indefinite" />
      
      <!-- The Boat -->
      <path d="M20 120 L130 120 L145 105 L5 105 Z" fill="#05070A" stroke="#00F0FF" stroke-width="1.5" filter="url(#glow)"/>
      
      <!-- The Person Rowing -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 75 105; -15 75 105; 0 75 105" dur="2s" repeatCount="indefinite" />
        <!-- Head -->
        <circle cx="75" cy="85" r="5" fill="#00F0FF" opacity="0.8" />
        <!-- Body -->
        <line x1="75" y1="90" x2="75" y2="105" stroke="#00F0FF" stroke-width="2" />
        <!-- Oar -->
        <g>
           <animateTransform attributeName="transform" type="rotate" values="45 75 100; -45 75 100; 45 75 100" dur="2s" repeatCount="indefinite" />
           <line x1="75" y1="100" x2="20" y2="135" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" />
           <ellipse cx="20" cy="135" rx="3" ry="8" fill="#00F0FF" transform="rotate(-45 20 135)" />
        </g>
      </g>
    </g>
  </g>

  <!-- Border Lines for Sci-Fi feel -->
  <line x1="0" y1="149" x2="1000" y2="149" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.2" />
</svg>
